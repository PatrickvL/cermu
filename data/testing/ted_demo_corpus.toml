# =============================================================================
# TED 7360 Demo Test Corpus — Curated reference demos for regression testing
# =============================================================================
# ~28 demos/programs that collectively exercise every TED rendering mode,
# raster timing edge case, audio trick, and memory banking behavior.
#
# The "features" list uses canonical names:
#   evb         = Extended Vertical Borders (top/bottom border opening)
#   ehb         = Extended Horizontal Borders (sideborder graphics)
#   fli         = Flexible Line Interpretation (HFLI/MFLI/DFLI variants)
#   mcm         = Multicolor Mode
#   bitmap      = Bitmap mode
#   ecm         = Extended Color Mode
#   charmode    = Character mode tricks
#   raster      = Raster timing / per-line register changes
#   irq         = IRQ timing (interrupt-driven effects)
#   timer       = TED Timer 1/2/3 driven effects
#   digi        = TED+Digi audio (volume register sample playback)
#   colorram    = Color RAM manipulation
#   dma         = DMA timing / badline behavior
#   scroll      = Smooth scrolling (fine scroll registers)
#   blanking    = Screen blanking tricks
#   banking     = ROM banking / memory configuration
#   zoom4       = Zoom4 / QFLI mode (attribute reload every 4 lines)
#   fpp         = Freeline / FPP (multi-register per-scanline updates)
#   hsp         = Horizontal Scroll Position tricks ($FF1E)
#   fld         = Flexible Line Distance
#
# Each entry's "source" is a plus4world URL or "vice-testprogs" for local tests.
# =============================================================================

[corpus]
name = "TED 7360 Demo Test Corpus"
version = "1.0"
description = "Curated Plus/4 demos and test programs for TED emulator regression testing"

